<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WIC Energy · 宿电</title>
    <link rel="stylesheet" href="/css/base.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="user-wrapper">
        <span id="session-status">正在检查登录状态</span
        ><a class="button" id="login" href="/login.html" hidden>登录</a
        ><button id="logout" hidden>退出</button>
      </div>
      <h1 class="title">WIC Energy</h1>
      <p class="subtitle">宿电 · 学校用电查询 API</p>
      <div class="intro">
        <p>服务已运行。登录学校账户，即可查询余额与用电记录。</p>
        <p><a href="/docs.html">查看接口文档</a></p>
      </div>
      <h2 class="section-title">试试查询接口</h2>
      <p class="note">
        可留空使用学校默认日期。月用电展示截至所选月份的六个月数据。
      </p>
      <div id="endpoints" class="list"></div>
      <h2 class="section-title">查询结果</h2>
      <p id="request-status" class="status" role="status" aria-live="polite">
        登录后，选择上面的接口查询。
      </p>
      <p id="error" class="message" role="alert" hidden></p>
      <pre id="result" class="result" tabindex="0">尚未查询</pre>
      <footer>WIC Energy · 仅提供查询服务</footer>
    </div>
  </body>
</html>
