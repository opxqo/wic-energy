<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">WIC Energy system flow</title>
  <desc id="desc">Web console and command line use the shared energy core. The core securely communicates with the school energy system and returns read-only data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b3b"/><stop offset="1" stop-color="#0a4f97"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33d5ff"/><stop offset="1" stop-color="#1677ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#61d9ff"/></marker>
  </defs>
  <rect width="1200" height="410" rx="28" fill="url(#bg)"/>
  <path d="M64 74H1136M64 336H1136" stroke="#7be4ff" stroke-opacity=".2"/>
  <text x="64" y="65" fill="#8eeaff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" letter-spacing="2">READ-ONLY ENERGY DATA FLOW</text>
  <text x="1136" y="65" fill="#b4cbe9" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">WEB · CLI · API</text>
  <g transform="translate(64 126)">
    <rect width="220" height="145" rx="20" fill="#0b2d59" stroke="#4bd8ff" stroke-opacity=".65"/>
    <circle cx="43" cy="42" r="18" fill="url(#accent)"/><path d="M35 42h16M43 34v16" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="42" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="25" font-weight="700">使用入口</text>
    <text x="28" y="97" fill="#c9e7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">React Web 控制台</text>
    <text x="28" y="126" fill="#c9e7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">Node.js CLI</text>
  </g>
  <path d="M294 199H422" stroke="#61d9ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(434 126)">
    <rect width="330" height="145" rx="20" fill="#0e3d73" stroke="#58ddff"/>
    <path d="M45 28l-19 39h20l-9 42 39-54H55l13-27z" fill="#7ceaff"/>
    <text x="100" y="49" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="28" font-weight="700">共享能源核心</text>
    <text x="28" y="99" fill="#d3edff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20">登录 · Cookie · 参数校验 · HTML 解析</text>
    <text x="28" y="126" fill="#8eeaff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">packages/core</text>
  </g>
  <path d="M774 199H902" stroke="#61d9ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(914 126)">
    <rect width="222" height="145" rx="20" fill="#0b2d59" stroke="#4bd8ff" stroke-opacity=".65"/>
    <path d="M37 88V50l31-19 31 19v38M54 88V64h28v24M46 50h8m28 0h8" fill="none" stroke="#8eeaff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="52" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700">学校系统</text>
    <text x="105" y="85" fill="#c9e7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19">能源管理页面</text>
    <text x="28" y="124" fill="#8eeaff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">upstream</text>
  </g>
  <text x="64" y="367" fill="#b4cbe9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">浏览器使用 HttpOnly Cookie；外部客户端使用 Bearer 会话。所有能源查询均为只读。</text>
</svg>
